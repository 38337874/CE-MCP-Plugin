name: Build CE-MCP-Plugin

on:
  push:
    branches: [ main, master, CE-MCP-Plugin ]
  pull_request:
    branches: [ main, master, CE-MCP-Plugin ]
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build Configuration'
        required: true
        default: 'Release'
        type: choice
        options:
        - Release
        - Debug
      platform:
        description: 'Build Platform'
        required: true
        default: 'Win32'
        type: choice
        options:
        - Win32
        - x64

jobs:
  build:
    runs-on: windows-latest
    
    env:
      SOLUTION_FILE_PATH: CE-MCP-Plugin.sln
      BUILD_CONFIGURATION: ${{ github.event.inputs.configuration || 'Release' }}
      BUILD_PLATFORM: ${{ github.event.inputs.platform || 'Win32' }}
      VISUAL_STUDIO_VERSION: '17.0' # Visual Studio 2022

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
      with:
        vs-version: ${{ env.VISUAL_STUDIO_VERSION }}
        msbuild-architecture: ${{ env.BUILD_PLATFORM }}

    - name: Build Lua 5.3 static libraries
      shell: pwsh
      run: |
        $workspace = $env:GITHUB_WORKSPACE
        # Locate the project file dynamically (checkout structure varies), then place libs next to it
        $projFile = Get-ChildItem -Path $workspace -Recurse -Filter 'CE-MCP-Plugin.vcxproj' -ErrorAction SilentlyContinue | Select-Object -First 1
        if (-not $projFile) { Write-Error 'CE-MCP-Plugin.vcxproj not found under workspace'; exit 1 }
        $libsDir = Join-Path $projFile.DirectoryName 'libs'
        Write-Host "Project dir: $($projFile.DirectoryName)"
        Write-Host "Libs dir: $libsDir"
        $luaSrcDir = Join-Path $env:RUNNER_TEMP 'lua-5.3.6'
        $luaSrcZip = Join-Path $env:RUNNER_TEMP 'lua-5.3.6.tar.gz'

        if (-not (Test-Path $libsDir)) { New-Item -ItemType Directory -Path $libsDir -Force | Out-Null }

        if (-not (Test-Path (Join-Path $luaSrcDir 'src\lua.c'))) {
          Write-Host 'Downloading Lua 5.3.6 source code...'
          Invoke-WebRequest -Uri 'https://www.lua.org/ftp/lua-5.3.6.tar.gz' -OutFile $luaSrcZip -UseBasicParsing
          tar -xzf $luaSrcZip -C $env:RUNNER_TEMP
        }

        # Locate Visual Studio via vswhere
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        if (-not (Test-Path $vswhere)) { Write-Error "vswhere.exe not found"; exit 1 }
        $vsPath = & $vswhere -latest -property installationPath
        if (-not $vsPath) { Write-Error "Visual Studio installation not found"; exit 1 }
        Write-Host "VS path: $vsPath"

        function Build-LuaLib([string]$arch, [string]$outName) {
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars$arch.bat"
          if (-not (Test-Path $vcvars)) { Write-Error "vcvars$arch.bat not found: $vcvars"; exit 1 }

          # Clean per-arch work dir so 32/64 obj files never mix
          $workDir = Join-Path $env:RUNNER_TEMP "lua-build-$arch"
          if (Test-Path $workDir) { Remove-Item $workDir -Recurse -Force }
          New-Item -ItemType Directory -Path $workDir | Out-Null
          Copy-Item (Join-Path $luaSrcDir 'src\*') $workDir

          Write-Host "Building Lua 5.3.6 for $arch..."
          Push-Location $workDir
          try {
            cmd /c ("`"" + $vcvars + "`" && cl /MT /O2 /c /DLUA_BUILD_AS_DLL *.c && lib /OUT:lua53-static.lib *.obj") | Out-Host
            if ($LASTEXITCODE -ne 0) { Write-Error "Lua $arch build failed with exit code $LASTEXITCODE"; exit 1 }
            Copy-Item (Join-Path $workDir 'lua53-static.lib') (Join-Path $libsDir $outName) -Force
          } finally {
            Pop-Location
          }
          Write-Host "Built $outName"
        }

        Build-LuaLib '32' 'lua53-32.lib'
        Build-LuaLib '64' 'lua53-64.lib'

        Write-Host 'libs content:'
        Get-ChildItem -Path $libsDir -Force | Format-Table Name,Length

    - name: Build solution
      run: msbuild ${{ env.SOLUTION_FILE_PATH }} /p:Configuration=${{ env.BUILD_CONFIGURATION }} /p:Platform=${{ env.BUILD_PLATFORM }} /p:BuildProjectReferences=true /p:RestorePackagesConfig=true /verbosity:minimal
      shell: cmd
      working-directory: ${{ github.workspace }}

    - name: List build output
      shell: pwsh
      run: |
        if ('${{ env.BUILD_PLATFORM }}' -eq 'x64') {
          Get-ChildItem -Path "${{ env.BUILD_PLATFORM }}\${{ env.BUILD_CONFIGURATION }}" -Force | Format-Table Name,Length,LastWriteTime
        } else {
          Get-ChildItem -Path "${{ env.BUILD_CONFIGURATION }}" -Force | Format-Table Name,Length,LastWriteTime
        }
      working-directory: ${{ github.workspace }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: CE-MCP-Plugin-${{ env.BUILD_PLATFORM }}-${{ env.BUILD_CONFIGURATION }}
        path: |
          ${{ env.BUILD_PLATFORM }}/${{ env.BUILD_CONFIGURATION }}/CE-MCP-Plugin.dll
          ${{ env.BUILD_CONFIGURATION }}/CE-MCP-Plugin.dll
        retention-days: 30
